version: '3.8'

services:
  # 🌐 Only Frontend + Backend application container layer active
  web:
    image: khushijaiswal27/aws-dummy-app:latest
    container_name: taskforage-web
    ports:
      - "80:5000" # Maps to Standard public port 80
    environment:
      # 🚀 THE AWS RDS MAGIC CONNECT LINK:
      - DATABASE_URL=postgresql://${{ secrets.RDS_USER }}:${{ secrets.RDS_PASS }}@${{ secrets.RDS_ENDPOINT }}:5432/${{ secrets.RDS_DB_NAME }}
