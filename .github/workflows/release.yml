name: dummy-python-projwith-RELEASE

on:
  push:
    branches:
      - releasebranch # 🚀 Target branch set to releasebranch
  workflow_dispatch: # 🎛️ Manual Run switch active 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Docker Hub Login
    - name: Docker hub login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Docker Image Build
    - name: Build App Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest .

    # Docker Image Push
    - name: Push App Image
      run: |
         docker push ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest

    # AWS EC2 Docker Compose Deployment
    - name: Deploy app to EC2 via Compose
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          mkdir -p ~/aws-dummy-app && cd ~/aws-dummy-app
          sudo rm -f docker-compose.yml
          
          # GitHub se seedha jaya branch ki compose file download karna
          sudo wget https://githubusercontent.com{{ github.repository }}/jaya/docker-compose.yml
          
          sudo docker compose pull
          sudo docker compose up -d --remove-orphans
    # Automated github release step ( deployment pass hone k bad release banana)
    - name: create Automated Production Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # github ka secret inbuilt token
      with:
         tag_name: v1.0.0-release # mera release ka version tag
         release_name: Release v1.0.0 - Fullstack Orchestration Lanuch
         body: |
           ###  Milestone Release Published
           Sir, this is an automated version release snapshot.
           - Frontend + flask backend live via docker compose.
           - Multi-container architecture completely verified.
         draft: false
         prerelease: false
          
