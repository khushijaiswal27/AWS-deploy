name: Dummy-python-proj

# Trigger: Jab bhi 'main' branch par push hoga, pipeline chalegi
on:
  push:
    branches:
      - shruti

jobs:
  deploy:
    runs-on: ubuntu-latest # GitHub Actions ka temporary Linux server

    steps:
    # Step 1: GitHub repository se code ko temporary runner par copy karna
    - name: Checkout code
      uses: actions/checkout@v4
    # Step 2:  Setup python enviornment
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # 3. cace pip depenedencies usin a custom key ( sir wala logic)
    - name: Cache pip dependencies
      id: python-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    # 4. check for cache hit or miss, and install
    - name: install dependencies from scratch on cache miss
      if: steps.python-cache.outputs.cache-hit != 'true'
      run: |
        echo "Cache MISS: Installing dependencies from scratch..."
        pip install -r requirements.txt

    - name: Print Cache Status
      if: steps.python-cache.outputs.cache-hit == 'true'
      run: |
        echo "Cache HIT: Skipping pip install!"
        
    # Step 5: Docker Hub me safely log in karna
    - name: Docker hub login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # Step 6: Project ki Dockerfile ko read karke Docker Image build karna
    - name: Build App Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest .

    # Step 7: Bani hui Docker Image ko Docker Hub Registry par upload karna
    - name: Push App Image
      run: |
         docker push ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest

    # Step 8: SSH ke zariye AWS EC2 me login karke commands run karna
    - name: Deploy app to EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22 # Linux SSH default port
        script: |
          # 1. Docker Hub se latest image ko EC2 me download (pull) karna
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest
          
          # 2. Agar koi purana container same naam se chal raha hai to use delete karna
          sudo docker rm -f aws-dummy-cont || true
          
          # 3. Naye container ko background (-d) me automatic restart policy ke sath Port 80 par run karna
          sudo docker run -d --restart unless-stopped --name aws-dummy-cont -p 80:5000 ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest
