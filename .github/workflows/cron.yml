name: Dummy-python-proj-with-corn

on:
  push:
    branches:
      - main # jab main branch pe push honga tbhi ye active hongi
      
  workflow_dispatch: # 👈 Yeh line jod do
  
  schedule:
    - cron: '*/5 * * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Github repo se code copy krna
    - name: Checkout code
      uses: actions/checkout@v4
    # 2. docker hub me login krna
    - name: Docker hub login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    # 3. Code ko pack krke Docker Image banana (yaha (dot ".") ka mtlb hai root me hi dockerfile hai)
    - name: Build App Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest .
    # 4. Us Docker Image ko Docker Hub pr upload krna
    - name: Push App Image
      run: |
         docker push ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app:latest
    # 5. AWS EC2 login krke project ko chalana
    - name: Deploy app to EC2
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # Latest image download karna
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app
          # Purana container delete karna ( agar phle se chl rha ho to)
          sudo docker rm -f aws-dummy-cont || true
          # Naye container ko port 80 pr run krna
          sudo docker run -d --restart unless-stopped --name aws-dummy-cont -p 80:5000 ${{ secrets.DOCKER_USERNAME }}/aws-dummy-app
          
