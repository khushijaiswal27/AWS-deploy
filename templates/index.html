<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskForge - DevOps Testing App</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 650px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
        .badge { background: #38bdf8; color: #0f172a; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; }
        .status-box { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; font-size: 14px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-add { background: #10b981; color: #fff; }
        .btn-crash { background: #ef4444; color: #fff; margin-top: 15px; width: 100%; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #334155; padding: 12px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>TaskForge Hub - Live Volume Works! </h2>
            <span class="badge">{{ version }}</span>
        </div>

        <div class="status-box">
            <span>Container Status: <strong id="healthText" style="color: #10b981;">Checking...</strong></span>
            <span>Host: <strong>AWS EC2 / Localhost</strong></span>
        </div>

        <div class="form-row">
            <input type="text" id="taskInput" placeholder="Enter a new DevOps test task...">
            <button class="btn-add" onclick="addTask()">Add Task</button>
        </div>

        <ul id="taskList"></ul>

        <button class="btn-crash" onclick="simulateCrash()">Simulate Container Crash (DevOps Test)</button>
    </div>

    <script>
        async function fetchHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                document.getElementById('healthText').innerText = data.status === 'healthy' ? 'Healthy (200 OK)' : 'Degraded';
            } catch (err) {
                document.getElementById('healthText').innerText = 'Unreachable / Dead';
                document.getElementById('healthText').style.color = '#ef4444';
            }
        }

        async function loadTasks() {
            try {
                const res = await fetch('/api/tasks');
                const tasks = await res.json();
                const list = document.getElementById('taskList');
                list.innerHTML = '';
                tasks.forEach(t => {
                    const li = document.createElement('li');
                    li.innerHTML = `<span>${t.title}</span><small style="color: #94a3b8;">${t.status}</small>`;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            await fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value })
            });
            input.value = '';
            loadTasks();
        }

        async function simulateCrash() {
            alert('Triggering process exit. Container will crash!');
            await fetch('/crash', { method: 'POST' });
        }

        fetchHealth();
        loadTasks();
    </script>
</body>
</html>
